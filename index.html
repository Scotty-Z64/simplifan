<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#2BBCA8" />
    <title>SimpliPlan - Celebrating People</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #F1F5F9; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
      #loading {
        position: fixed; top: 0; left: 0; right: 0; bottom: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #F1F5F9; z-index: 1;
      }
      #loading h1 { color: #1a1a2e; font-size: 28px; margin-bottom: 8px; }
      #loading p { color: #64748B; font-size: 14px; margin-bottom: 24px; }
      .spinner {
        width: 40px; height: 40px; border: 4px solid #E2E8F0;
        border-top-color: #2BBCA8; border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      #loading-error {
        display: none; padding: 20px; color: #ff6b6b; font-size: 12px; text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="loading">
      <h1>SimpliPlan</h1>
      <p>South Africa's Event Planner</p>
      <div class="spinner"></div>
      <div id="loading-error"></div>
    </div>
    <div id="root"></div>
    <script>
      // Unregister old service workers
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          regs.forEach(function(r) { r.unregister(); });
        });
      }
      // Timeout: if React doesn't mount in 15s, show error
      setTimeout(function() {
        var root = document.getElementById('root');
        if (!root || root.children.length === 0) {
          document.getElementById('loading-error').style.display = 'block';
          document.getElementById('loading-error').textContent = 'Taking longer than expected. Please check your connection and refresh.';
        }
      }, 15000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>

</html>
