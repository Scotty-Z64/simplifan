<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#2BBCA8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SimpliPlan" />
    <meta name="description" content="South Africa's AI-powered event planner. Plan weddings, funerals, uMgidi, birthdays and more in just 7 taps." />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>SimpliPlan - Celebrating People</title>
  </head>
  <body>
    <div id="root"></div>
    <div id="error-display" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#1a1a2e;color:#fff;padding:20px;z-index:99999;font-family:monospace;font-size:14px;overflow:auto;">
      <h3 style="color:#ff6b6b;">Loading Error</h3>
      <pre id="error-text"></pre>
    </div>
    <script>
      window.onerror = function(msg, url, line, col, err) {
        var display = document.getElementById('error-display');
        var text = document.getElementById('error-text');
        if (display && text) {
          display.style.display = 'block';
          text.textContent = msg + '\n at ' + url + ':' + line + ':' + col + '\n' + (err && err.stack ? err.stack : '');
        }
        return false;
      };
      window.onunhandledrejection = function(e) {
        var display = document.getElementById('error-display');
        var text = document.getElementById('error-text');
        if (display && text) {
          display.style.display = 'block';
          text.textContent = 'Unhandled Promise Rejection:\n' + (e.reason && e.reason.stack ? e.reason.stack : String(e.reason));
        }
      };
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('SimpliPlan PWA: Service Worker registered'))
            .catch(err => console.log('SimpliPlan PWA: SW registration failed', err));
        });
      }
    </script>
  </body>
</html>
